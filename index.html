  <script>

      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {

          },
          colors: {
            forest: {
              50: '#F2F8F5',
              100: '#E1EFE8',
              200: '#C2DFD1',
              300: '#94C6AF',
              400: '#5FA686',
              500: '#3D8C69',
              600: '#2D6A4F',
              700: '#1B4332',
              800: '#133527',
              900: '#0F291E',
              950: '#081711',
            },
            stream: {
              50: '#ecfeff',
              100: '#cffafe',
              200: '#a5f3fc',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            }
          },
          boxShadow: {
            'nature': '0 10px 30px -4px rgba(15, 41, 30, 0.07), 0 4px 10px -2px rgba(15, 41, 30, 0.04)',
            'nature-hover': '0 20px 40px -6px rgba(15, 41, 30, 0.12), 0 8px 18px -3px rgba(15, 41, 30, 0.08)',
            'floating': '0 20px 45px -10px rgba(8, 23, 17, 0.4)',
            'glow-emerald': '0 0 25px 2px rgba(52, 211, 153, 0.35)',
            'glow-red': '0 0 25px 2px rgba(239, 68, 68, 0.3)',
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-topo text-stone-800 antialiased selection:bg-forest-200 selection:text-forest-900 pb-24 md:pb-16 font-sans">

  <div id="scroll-indicator" class="fixed top-0 left-0 h-1 bg-gradient-to-r from-emerald-400 via-teal-400 to-forest-500 z-[70] w-0 transition-[width] duration-75"></div>

  <div data-include="components/navbar.html"></div>

  <div data-include="components/hero.html"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-14 space-y-10 lg:space-y-12">
    <div data-include="components/row-01-02.html"></div>

    <div data-include="components/row-03-05.html"></div>

    <div data-include="components/section-04.html"></div>

    <div data-include="components/section-06.html"></div>

    <div data-include="components/closing.html"></div>
  </main>

  <div data-include="components/mobile-bar.html"></div>

<script src="js/app.js"></script>
<script>
  async function loadComponent(el) {
    const file = el.getAttribute('data-include');
    if (!file) return;
    try {
      const resp = await fetch(file);
      if (resp.ok) {
        const html = await resp.text();
        const template = document.createElement('div');
        template.innerHTML = html.trim();
        const newEl = template.firstElementChild || template;
        el.replaceWith(newEl);
      } else {
        console.error(`Gagal memuat ${file}: status ${resp.status}`);
      }
    } catch (e) {
      console.error(`Gagal memuat ${file}`, e);
    }
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const elements = Array.from(document.querySelectorAll('[data-include]'));
    await Promise.all(elements.map(loadComponent));

    requestAnimationFrame(() => {
      if (window.lucide) {
        lucide.createIcons();
      }
      if (typeof initApp === 'function') {
        initApp();
      }
    });
  });
</script>
</body>
</html>
